<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskBoard — TypeScript Develop + Test</title>
  <style>
    :root {
      --bg: #eef3f9;
      --ink: #142033;
      --muted: #5b6b80;
      --card: #fff;
      --accent: #3178c6;
      --border: #c9d7e8;
      --todo: #64748b;
      --doing: #b45309;
      --done: #15803d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #e8f0fa 0%, #f5f7fb 45%, #eef6f2 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #1e3a5f;
      color: #e2e8f0;
    }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
    header .sub { color: #93c5fd; font-size: 0.85rem; }
    main { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(20, 40, 70, 0.06);
    }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input, select, button {
      font: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    input { width: 100%; max-width: 320px; background: #fff; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #475569; }
    button.danger { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 10px;
      display: none;
    }
    .error.show { display: block; }
    .hint { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    #boardView { display: none; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .col h2 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .task {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fafcff;
    }
    .task .title { font-weight: 700; margin-bottom: 8px; }
    .task .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .task .actions button { padding: 4px 8px; font-size: 0.8rem; }
    .status-todo { border-left: 4px solid var(--todo); }
    .status-doing { border-left: 4px solid var(--doing); }
    .status-done { border-left: 4px solid var(--done); }
    #emptyHint { color: var(--muted); font-style: italic; display: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>TaskBoard</h1>
      <div class="sub">Phase B mini-app · typed Express API + vanilla UI</div>
    </div>
    <div id="headerUser" class="sub" hidden></div>
  </header>

  <main>
    <section id="loginView" class="panel" aria-label="Login">
      <h2 style="margin-top:0;color:var(--accent);">Sign in</h2>
      <p class="hint">Seed users: <code>alice / alice123</code> · <code>bob / bob123</code></p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" value="alice" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="alice123" />
      <div class="row">
        <button type="button" id="loginBtn">Log in</button>
      </div>
      <div id="loginError" class="error" role="alert"></div>
    </section>

    <section id="boardView" aria-label="Task board">
      <div class="meta">
        <span class="badge" id="whoBadge">—</span>
        <button type="button" class="secondary" id="logoutBtn">Log out</button>
        <button type="button" class="secondary" id="resetBtn" title="Restore seed data">Reset seed</button>
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <h2 style="margin-top:0;font-size:1rem;">Add task</h2>
        <label for="newTitle">Title</label>
        <input id="newTitle" maxlength="120" placeholder="e.g. Write API request test" />
        <div class="row">
          <button type="button" id="addBtn">Add</button>
        </div>
        <div id="boardError" class="error" role="alert"></div>
      </div>

      <p id="emptyHint">No tasks yet — add one above.</p>
      <div class="columns" id="columns">
        <div class="col" data-status="todo"><h2>Todo</h2><div class="list"></div></div>
        <div class="col" data-status="doing"><h2>Doing</h2><div class="list"></div></div>
        <div class="col" data-status="done"><h2>Done</h2><div class="list"></div></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
